[package]
name = "daemon_api"
version = "0.1.0"
edition = "2021"
description = "aishd RPC protocol types and framing (Phase10)."

[lib]
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net"] }

