[workspace]
resolver = "2"
# crates/aish は core/ai と core/aish と同じ出力名(ai, aish)を使うため、通常ビルドでは除外して出力衝突を避ける
default-members = [
    "core/common",
    "core/ai",
    "core/aish",
    "crates/daemon_api",
    "crates/core",
    "crates/storage",
    "crates/capture",
    "crates/orchestrator",
    "crates/plugins",
    "crates/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
members = [
    "core/common",
    "core/ai",
    "core/aish",
    "crates/daemon_api",
    "crates/aish",
    "crates/core",
    "crates/storage",
    "crates/capture",
    "crates/orchestrator",
    "crates/plugins",
    "crates/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
