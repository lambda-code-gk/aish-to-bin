[workspace]
resolver = "2"
# apps/ai と apps/aish は lib のみ。バイナリ ai / aish は bins/aish-cli から生成。
default-members = [
    "libs/common",
    "apps/ai",
    "apps/aish",
    "bins/aish-cli",
    "libs/daemon_api",
    "experimental/core",
    "libs/storage",
    "experimental/capture",
    "experimental/orchestrator",
    "libs/plugins",
    "experimental/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
members = [
    "libs/common",
    "apps/ai",
    "apps/aish",
    "libs/daemon_api",
    "bins/aish-cli",
    "experimental/core",
    "libs/storage",
    "experimental/capture",
    "experimental/orchestrator",
    "libs/plugins",
    "experimental/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
