[workspace]
resolver = "2"
# core/ai と core/aish は lib のみ。バイナリ ai / aish は crates/aish (aish-cli) から生成。
default-members = [
    "core/common",
    "core/ai",
    "core/aish",
    "crates/aish",
    "crates/daemon_api",
    "crates/core",
    "crates/storage",
    "crates/capture",
    "crates/orchestrator",
    "crates/plugins",
    "crates/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
members = [
    "core/common",
    "core/ai",
    "core/aish",
    "crates/daemon_api",
    "crates/aish",
    "crates/core",
    "crates/storage",
    "crates/capture",
    "crates/orchestrator",
    "crates/plugins",
    "crates/providers",
    "xtask",
    "tools/leakscan",
    "tools/md-fmt",
]
