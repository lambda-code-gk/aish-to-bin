[package]
name = "aish"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
common = { path = "../../libs/common" }
daemon_api = { path = "../../libs/daemon_api" }
plugins = { path = "../../libs/plugins" }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
storage = { path = "../../libs/storage" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync"] }
unicode-width = "0.1"

