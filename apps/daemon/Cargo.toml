[package]
name = "aish-daemon"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
ai = { path = "../ai" }
common = { path = "../../libs/common" }
daemon_api = { path = "../../libs/daemon_api" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
storage = { path = "../../libs/storage" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "time", "sync", "signal", "macros"] }
