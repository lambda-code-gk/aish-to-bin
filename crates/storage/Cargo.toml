[package]
name = "storage"
version = "0.1.0"
edition = "2021"
description = "SessionEventStore / DerivedBuilder; events/index/snapshots/artifacts. Phase8 slot."

[lib]
path = "src/lib.rs"

[dependencies]
common = { path = "../../core/common" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
